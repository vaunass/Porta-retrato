<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Porta IPTV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0a0e1a;color:#eef1fb;font-family:Arial,Helvetica,sans-serif}
.w{display:flex;height:100%;align-items:center;justify-content:center;text-align:center}
.c{width:760px}
h1{font-size:54px;margin:0 0 10px}h1 span{color:#ff4b3e}
p{color:#98a2c3;font-size:24px;line-height:1.4;margin:0 0 26px}
input{width:100%;box-sizing:border-box;font-size:34px;padding:16px 20px;border-radius:16px;border:2px solid #333b5c;background:#11172a;color:#fff;text-align:center}
button{margin:22px 10px 0;font-size:30px;padding:16px 36px;border:0;border-radius:16px;background:#ff4b3e;color:#fff}
input:focus,button:focus{outline:4px solid #ff4b3e}
#m{height:34px;margin-top:20px;font-size:24px;color:#ff8a9a}
</style></head><body>
<div class="w"><div class="c">
<h1>Porta<span>IPTV</span></h1>
<p id="p">Digite o endereço do servidor (o que aparece no terminal do computador), por exemplo <b>192.168.0.10:8787</b></p>
<input id="a" placeholder="192.168.0.10:8787" autocomplete="off">
<div><button id="go">Abrir</button><button id="chg" style="display:none;background:#2a3150">Trocar servidor</button></div>
<div id="m"></div>
</div></div>
<script>
(function(){
  var KEY='portaiptv.server', a=document.getElementById('a'), m=document.getElementById('m');
  function get(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
  function set(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function norm(v){v=v.trim().replace(/^https?:\/\//i,'').replace(/\/+$/,'');if(!v)return '';if(v.indexOf(':')<0)v+=':8787';return 'http://'+v}
  function test(url){return new Promise(function(ok,no){
    var done=false,t=setTimeout(function(){if(!done){done=true;no()}},6000);
    fetch(url+'/api/state',{mode:'no-cors'}).then(function(){if(!done){done=true;clearTimeout(t);ok()}},function(){if(!done){done=true;clearTimeout(t);no()}});
  })}
  function open(url){location.href=url+'/?tv=1'}
  function go(){
    var url=norm(a.value); if(!url){m.textContent='Digite o endereço.';return}
    m.style.color='#98a2c3';m.textContent='Conectando…';
    test(url).then(function(){set(a.value.trim());open(url)},function(){m.style.color='#ff8a9a';m.textContent='Não encontrei o servidor. Confira o endereço e se ele está ligado.'});
  }
  document.getElementById('go').onclick=go;
  a.addEventListener('keydown',function(e){if(e.keyCode===13)go()});
  var saved=get();
  if(saved&&location.hash!=='#trocar'){
    a.value=saved;m.style.color='#98a2c3';m.textContent='Abrindo '+saved+'…';
    test(norm(saved)).then(function(){open(norm(saved))},function(){m.style.color='#ff8a9a';m.textContent='Servidor não respondeu. Confira ou digite outro endereço.'});
  }
  setTimeout(function(){a.focus()},200);
})();
</script></body></html>
